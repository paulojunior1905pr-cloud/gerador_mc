<style>.bkbar{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px;background:var(--side-hi,#1b3a5a);border-radius:10px;font:12.5px Inter,Segoe UI,system-ui,sans-serif;color:var(--side-ink,#b4c4d4)}.bkbar>span:first-child{display:block;line-height:1.35;word-break:break-all}.bkbar>span:first-child b{color:#fff;font-weight:600}.bkbar button,.bkbar .bkbtn{position:relative;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:7px;padding:6px 10px;min-height:32px;font:inherit;text-align:center;cursor:pointer}.bkbar button:hover,.bkbar .bkbtn:hover{background:rgba(255,255,255,.18)}.bkbar #bkSair,.bkbar #bkEntrar{align-self:flex-start}.bkbar #bkMsg:empty{display:none}.top .bkbar{order:7}body>.bkbar{margin:0 16px 16px;background:var(--side,#0f2236)}.loginov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,32,.72)}.loginov[hidden]{display:none}.logincx{background:var(--panel,#fff);color:var(--ink,#1f2a37);max-width:420px;width:100%;border-radius:12px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.35);font:15px system-ui;text-align:center}.logincx h2{margin:0 0 8px}.logincx p{line-height:1.45}.logincx #lgGoogle{font-size:16px;padding:10px 18px;cursor:pointer}.lgerro{color:#c0392b;min-height:1em;font-size:14px}.bkesp{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;font-variant-numeric:tabular-nums}.bkesp[hidden]{display:none}.bkesp i{grid-column:1/-1;order:3;display:block;width:100%;height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}.bkesp i b{display:block;height:100%;background:#6fcf8f}.bkesp.alto i b{background:#f0a94a}.bkesp.cheio i b{background:#ff8a80}.lglocal{background:none;border:0;color:inherit;opacity:.8;text-decoration:underline;cursor:pointer;font:inherit;font-size:14px}</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>/* GitHub Pages: MCs na nuvem (Firebase, login Google). Sem login: salva no aparelho (IndexedDB). */
(function(){
  if(window.claude) return;
  const EQUIPE="equipes/rnest/";
  let equipeAtiva=false;
  const CFG={apiKey:"AIzaSyAfJ-JvVzBbACDe-woWivQBQ5s89wVq9M0",authDomain:"gerador-mc.firebaseapp.com",projectId:"gerador-mc",storageBucket:"gerador-mc.firebasestorage.app",messagingSenderId:"4121049572",appId:"1:4121049572:web:41329bbe804b2897f32ff1"};
  const LS={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
  /* ---- armazenamento local (IndexedDB) ---- */
  const DBN="gerador-mc", ST="docs"; let _db=null;
  const abre=()=>_db||(_db=new Promise((ok,er)=>{ const r=indexedDB.open(DBN,1); r.onupgradeneeded=()=>r.result.createObjectStore(ST); r.onsuccess=()=>ok(r.result); r.onerror=()=>er(r.error); }));
  const tx=async(modo,fn)=>{ const d=await abre(); return new Promise((ok,er)=>{ const t=d.transaction(ST,modo); const r=fn(t.objectStore(ST)); t.oncomplete=()=>ok(r&&r.result); t.onerror=()=>er(t.error); }); };
  const get=k=>tx("readonly",s=>s.get(k)), put=(k,v)=>tx("readwrite",s=>s.put(v,k)), del=k=>tx("readwrite",s=>s.delete(k));
  const todos=async pre=>{ const d=await abre(); return new Promise((ok,er)=>{ const out=[]; const t=d.transaction(ST,"readonly"); const c=t.objectStore(ST).openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ if(String(cur.key).startsWith(pre)) out.push([cur.key,cur.value]); cur.continue(); } }; t.oncomplete=()=>ok(out); t.onerror=()=>er(t.error); }); };
  const ouvintes={};
  const snapCol=async col=>{ const r=await todos(col+"/"); const docs=r.map(([k,v])=>({id:k.slice(col.length+1),exists:true,data:()=>JSON.parse(JSON.stringify(v))})); return {size:docs.length,docs}; };
  const avisa=async col=>{ const l=ouvintes[col]; if(!l||!l.length) return; const s=await snapCol(col); l.forEach(f=>f(s)); };
  const docL=path=>{ const col=path.split("/")[0]; return { id:path.split("/").pop(), path,
    get:async()=>{ const v=await get(path); return {id:path.split("/").pop(),exists:v!==undefined,data:()=>v}; },
    set:async v=>{ await put(path,JSON.parse(JSON.stringify(v))); avisa(col); },
    update:async v=>{ const a=(await get(path))||{}; await put(path,Object.assign(a,JSON.parse(JSON.stringify(v)))); avisa(col); },
    delete:async()=>{ await del(path); avisa(col); } }; };
  const local={ doc:docL, collection:col=>({ doc:id=>docL(col+"/"+id),
    get:()=>snapCol(col),
    onSnapshot:(next,err)=>{ (ouvintes[col]=ouvintes[col]||[]).push(next); snapCol(col).then(next,e=>err&&err({code:String(e)})); return ()=>{ ouvintes[col]=ouvintes[col].filter(f=>f!==next); }; } }) };
  /* ---- downloads ---- */
  const baixa=(blob,nome)=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000); };
  const downloads={ save:async({filename,data})=>{ baixa(data instanceof Blob?data:new Blob([data]),filename); return {status:"saved"}; } };
  /* ---- ponte com o app ---- */
  let resolveDb; const dbPronto=new Promise(r=>resolveDb=r); let atual=null, modo="", usuario=null, auth=null;
  window.claude={ use:async n=> n==="db"?dbPronto : n==="downloads"?downloads : null };
  window.__aguardandoLogin=true;
  const pronto=(db,m)=>{ atual=db; modo=m; window.__aguardandoLogin=false; resolveDb(db); barra(); };
  /* ---- interface: barra e tela de login ---- */
  let bar=null, ov=null;
  const onDom=f=>document.readyState==="loading"?document.addEventListener("DOMContentLoaded",f):f();
  function barra(){ onDom(()=>{
    if(!bar){ bar=document.createElement("div"); bar.className="bkbar";
      /* computador: dentro da barra lateral, abaixo do Tema; celular: no fim da página */
      const mq=matchMedia("(min-width:901px)"), poe=()=>{ const t=document.querySelector(".top"); if(mq.matches&&t) t.appendChild(bar); else document.body.appendChild(bar); };
      poe(); mq.addEventListener("change",poe); }
    const quem = modo==="nuvem" ? (equipeAtiva?"👥 Espaço da equipe · ":"☁️ Na nuvem: ")+`<b>${(usuario&&(usuario.email||usuario.displayName))||"conectado"}</b>` : "💾 Salvo só neste aparelho";
    bar.innerHTML=`<span>${quem}</span>`+(modo==="nuvem"?'<button type="button" id="bkSair">Sair</button>':(auth?'<button type="button" id="bkEntrar">Entrar com Google</button>':""))+
      '<span class="bkesp" id="bkEsp"></span><button type="button" id="bkOut">Baixar backup</button><label class="bkbtn">Restaurar backup<input type="file" accept=".json,application/json" id="bkIn" style="position:absolute;width:1px;height:1px;opacity:0"></label><span id="bkMsg"></span>';
    const q=s=>bar.querySelector(s);
    if(q("#bkSair")) q("#bkSair").onclick=async()=>{ await auth.signOut(); LS.set("mc_local","1"); location.reload(); };
    if(q("#bkEntrar")) q("#bkEntrar").onclick=()=>{ LS.del("mc_local"); location.reload(); };
    q("#bkOut").onclick=()=>backup();
    if(ultEsp) window.mcEspaco(ultEsp);
    q("#bkIn").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const n=await restaura(f); alert(n+" MC(s) restauradas."); }catch(x){ alert("Não foi possível restaurar: "+x.message); } e.target.value=""; };
  }); }
  let ultEsp=null;
  window.mcEspaco=e=>{ ultEsp=e; const el=bar&&bar.querySelector("#bkEsp"); if(!el) return; if(modo!=="nuvem"){ el.hidden=true; return; } el.hidden=false;
    const LIM=1024*1024*1024, pct=Math.min(100,e.bytes/LIM*100), mb=e.bytes/1048576;
    const tx=mb<1024?mb.toLocaleString("pt-BR",{maximumFractionDigits:1})+" MB":(mb/1024).toLocaleString("pt-BR",{maximumFractionDigits:2})+" GB";
    el.className="bkesp"+(pct>=90?" cheio":pct>=75?" alto":"");
    el.title=e.mcs+" MC(s) e "+e.fotos+" foto(s). Estimativa; o valor oficial fica no Firebase em Firestore Database > Uso.";
    el.innerHTML=`Espaço: ${tx} de 1 GB <i><b style="width:${Math.max(pct,0.5).toFixed(1)}%"></b></i> ${pct.toLocaleString("pt-BR",{maximumFractionDigits:pct<1?2:pct<10?1:0})}%`; };
  const msg=t=>{ const m=bar&&bar.querySelector("#bkMsg"); if(m) m.textContent=t; };
  function telaLogin(erro){ onDom(()=>{
    if(!ov){ ov=document.createElement("div"); ov.className="loginov"; document.body.appendChild(ov); }
    ov.hidden=false;
    ov.innerHTML=`<div class="logincx"><h2>Gerador de MC</h2><p>Entre com sua conta Google para salvar as MCs e fotos na nuvem e abrir em qualquer aparelho.</p>
      <button type="button" class="pri" id="lgGoogle">Entrar com Google</button>
      <p class="lgerro">${erro||""}</p>
      <button type="button" class="lglocal" id="lgLocal">Usar sem login (salva só neste aparelho)</button></div>`;
    ov.querySelector("#lgGoogle").onclick=entrar;
    ov.querySelector("#lgLocal").onclick=()=>{ LS.set("mc_local","1"); ov.hidden=true; pronto(local,"local"); };
  }); }
  function erroTxt(e){ const c=e&&e.code||""; return c==="auth/unauthorized-domain"?"Este endereço não está autorizado no Firebase (Authentication > Configurações > Domínios autorizados).":
    c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"?"Login cancelado.":c==="auth/network-request-failed"?"Sem internet. Tente de novo.":"Não foi possível entrar: "+(e&&(e.message||c)); }
  async function entrar(){ const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
    try{ await auth.signInWithPopup(p); }
    catch(e){ if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code)){ try{ await auth.signInWithRedirect(p); }catch(x){ telaLogin(erroTxt(x)); } } else telaLogin(erroTxt(e)); } }
  /* ---- migração do aparelho para a nuvem ---- */
  async function migra(nuvem,uid){ const flag="mc_migrado_"+uid; if(LS.get(flag)) return 0;
    let r=[]; try{ r=await todos(""); }catch(e){ return 0; }
    let n=0; for(const [k,v] of r){ try{ const ref=nuvem.doc(k); const s=await ref.get(); if(!s.exists){ await ref.set(v); if(k.startsWith("mcs/")) n++; } }catch(e){ console.warn("migração",k,e); } }
    LS.set(flag,"1"); return n; }
  /* ---- 1º acesso ao espaço da equipe: leva as MCs pessoais que ainda não estão lá ---- */
  async function copiaPessoal(de,para,uid){ const flag="mc_equipe_copiado_"+uid; if(LS.get(flag)) return 0; let n=0;
    try{ for(const c of ["fotos","mcs"]){ const s=await de.collection(c).get(); for(const d of s.docs){ const ref=para.doc(c+"/"+d.id); const x=await ref.get(); if(!x.exists){ await ref.set(d.data()); if(c==="mcs") n++; } } } LS.set(flag,"1"); }
    catch(e){ console.warn("cópia para equipe",e); } return n; }
  /* ---- backup ---- */
  async function backup(){ const o={}; for(const c of ["mcs","fotos"]){ const s=await atual.collection(c).get(); s.docs.forEach(d=>o[c+"/"+d.id]=d.data()); }
    baixa(new Blob([JSON.stringify({app:"gerador-mc",versao:1,data:new Date().toISOString(),docs:o})],{type:"application/json"}),"backup_MCs_"+new Date().toISOString().slice(0,10)+".json"); }
  async function restaura(file){ const j=JSON.parse(await file.text()); if(!j.docs) throw new Error("arquivo inválido");
    for(const [k,v] of Object.entries(j.docs)) await atual.doc(k).set(v); return Object.keys(j.docs).filter(k=>k.startsWith("mcs/")).length; }
  /* ---- início ---- */
  function inicia(){
    if(!window.firebase||!firebase.initializeApp){ pronto(local,"local"); return; }
    try{ firebase.initializeApp(CFG); auth=firebase.auth(); }catch(e){ pronto(local,"local"); return; }
    const fs=firebase.firestore(); try{ fs.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
    auth.getRedirectResult().catch(e=>telaLogin(erroTxt(e)));
    let primeiro=true;
    auth.onAuthStateChanged(async u=>{
      if(atual && modo==="nuvem"){ if(!u) location.reload(); return; }
      if(!u){ if(primeiro && LS.get("mc_local")){ pronto(local,"local"); } else if(!atual) telaLogin(); primeiro=false; return; }
      primeiro=false; usuario=u; if(ov) ov.hidden=true;
      if(atual && modo==="local"){ location.reload(); return; }
      LS.del("mc_local");
      const espaco=b=>({ doc:p=>fs.doc(b+p), collection:c=>fs.collection(b+c) });
      const pessoal=espaco("usuarios/"+u.uid+"/"), equipe=espaco(EQUIPE);
      /* tem acesso ao espaço da equipe? (e-mail liberado nas regras do Firestore) */
      const kEq="mc_equipe_"+u.uid; let naEquipe=LS.get(kEq)==="1";
      try{ await equipe.collection("mcs").get({source:"server"}); naEquipe=true; }
      catch(e){ if(e&&e.code==="permission-denied") naEquipe=false; }
      LS.set(kEq,naEquipe?"1":"0"); equipeAtiva=naEquipe;
      const nuvem=naEquipe?equipe:pessoal;
      let n=await migra(pessoal,u.uid);
      if(naEquipe) n+=await copiaPessoal(pessoal,equipe,u.uid);
      pronto(nuvem,"nuvem"); if(n) setTimeout(()=>msg(n+" MC(s) foram enviadas para "+(naEquipe?"o espaço da equipe.":"a nuvem.")),500);
    });
  }
  inicia();
})();
</script>

<style>
/* Layout: barra de ferramentas fixa + lista de MCs à esquerda + formulário em blocos numerados como a própria MC */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#14212e; --muted:#5b6876; --line:#dde3ea;
  --accent:#0b4f8a; --accent-ink:#ffffff; --entry:#fff6d9; --entry-line:#e7d08a;
  --ok:#1f7a3f; --warn:#a65b00; --bad:#b3261e; --chip:#f1f4f8;
  --side:#0f2236; --side-ink:#b4c4d4; --side-mut:#7f97ae; --side-line:#23394f; --side-hi:#1b3a5a; --side-acc:#2f7fd1;
  --shadow:0 1px 2px rgba(16,34,54,.06),0 4px 14px rgba(16,34,54,.05); --sel:#e8f1fb; --zebra:#fafbfd;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --panel:#16212b; --ink:#e3eaf0; --muted:#97a7b6; --line:#273746;
  --accent:#5aa2e6; --accent-ink:#08121b; --entry:#2f2a17; --entry-line:#6b5a22;
  --ok:#6fcf8f; --warn:#f0a94a; --bad:#ff8a80; --chip:#1d2b37;
  --side:#0a121a; --side-ink:#a9bbcc; --side-mut:#6c8399; --side-line:#1b2b3b; --side-hi:#16304a; --side-acc:#3b8ee0;
  --shadow:0 1px 2px rgba(0,0,0,.3); --sel:#17324c; --zebra:#182530; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --panel:#16212b; --ink:#e3eaf0; --muted:#97a7b6; --line:#273746;
  --accent:#5aa2e6; --accent-ink:#08121b; --entry:#2f2a17; --entry-line:#6b5a22;
  --ok:#6fcf8f; --warn:#f0a94a; --bad:#ff8a80; --chip:#1d2b37;
  --side:#0a121a; --side-ink:#a9bbcc; --side-mut:#6c8399; --side-line:#1b2b3b; --side-hi:#16304a; --side-acc:#3b8ee0;
  --shadow:0 1px 2px rgba(0,0,0,.3); --sel:#17324c; --zebra:#182530; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:16px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.top .sp{flex:1}
.tema{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tema select{min-height:32px}
.status{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
button,.btn{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px;min-height:28px}

button:disabled{opacity:.5;cursor:default}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;padding-block:16px 48px;

@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
aside{display:flex;flex-direction:column;gap:10px;min-width:0}

.listhead select{flex:1}
.oriw{display:inline-flex;flex-direction:column;font-size:12px;margin:0 8px 6px 0}

label.f.wide{grid-column:1/-1}

.tqinfo{grid-column:1/-1;border:1px solid var(--line,#d9dee5);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink,#1b2733)}
.tqinfo .tqh small{color:var(--muted)}
.tqinfo .tqg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 12px;margin-top:6px}
.tqinfo .tqg span{display:flex;flex-direction:column}.tqinfo .tqg small{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tqinfo .tqr{margin-top:6px;color:var(--muted);font-size:12px}
@media (max-width:520px){label.f.tpmc{grid-column:1/-1}}
.tpd{grid-column:1/-1;margin:-2px 0 0;font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent);padding:6px 10px;border-radius:6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--entry);border:1px solid var(--entry-line);border-radius:5px;padding:6px 8px;min-width:0;width:100%}

function etapasDe(it){ return DATA.etapas[it]||null; }
function calcEtapas(m){
  const et=etapasDe(m.etapa.item); const res={bm:0,acum:0,lotes:[]};
  m.etapa.lotes.forEach(l=>{ const a=num(l.area); let pb=0,pa=0;
    if(et && a!=null) et.forEach(([n,pc],k)=>{ const b=num(l.bms[k]); if(b!=null){ if(b===m.bm) pb+=pc; if(b<=m.bm) pa+=pc; } });
    const q={pb,pa,qb:a!=null?r3(a*pb):null,qa:a!=null?r3(a*pa):null}; res.lotes.push(q); res.bm+=q.qb||0; res.acum+=q.qa||0; });

}
function calcMC(m){
  const el=m.elems.map(calcElem);
  const et=calcEtapas(m);
  const linhas=m.itens.map((it,i)=>{
    if(!it.item||!PPU[it.item]) return null; const P=PPU[it.item];
    const n=itNum(it.item), faixa=n>=96&&n<=124;
    const met=METODOS.find(x=>x[0]===it.metodo)||METODOS[0]; const fat=faixa?met[1]:1;
    const precoAp=r2(P.p*fat), usaD=usaDemao(it.item), dem=usaD?(num(it.demaos)||1):1;
    const mem=r3(m.elems.reduce((s,e,k)=>s+(e.fl[i]&&el[k]!=null?el[k]:0),0));
    const prev=r3(mem*dem); const q=m.quadro[i]; const isEt=m.etapa.item===it.item&&!!etapasDe(it.item);
    let ant=num(q.ant)||0, bm;
    if(isEt){ bm=et.bm; ant=r3(et.acum-et.bm); }
    else if(numE(q.man)!=null) bm=numE(q.man);
    else if(num(q.pct)!=null) bm=m.modoAv==="acum"?r3(r3(prev*num(q.pct)/100)-ant):r3(prev*num(q.pct)/100);
    else bm=0;
    const acum=r3(ant+bm);
    return {i,item:it.item,P,faixa,fat,precoAp,dem,usaD,base:usaD?null:baseMed(it.item),mem,prev,ant,bm,acum,pa:prev?acum/prev:null,saldo:r3(prev-acum),valor:r2(bm*precoAp),isEt,metodo:it.metodo};
  });
  const total=r2(linhas.reduce((s,l)=>s+(l?l.valor:0),0));
  const alerts=[];
  linhas.forEach(l=>{ if(!l) return;
    if(l.bm<-0.0005) alerts.push(["bad",`Item ${l.item}: o medido neste BM ficou negativo (${fmt(l.bm,3)}). Confira o acumulado anterior e o % acumulado.`]);
    if(l.acum>l.prev+0.0005) alerts.push(["bad",`Item ${l.item}: o acumulado (${fmt(l.acum,3)}) passa da quantidade prevista (${fmt(l.prev,3)}).`]);
    if(l.faixa && !l.metodo) alerts.push(["",`Item ${l.item}: informe o método. Se for convencional (operador no bico/pistola), o preço cai 30%.`]);
    if(l.faixa && l.prev>1000 && l.metodo==="conv") alerts.push(["",`Item ${l.item}: área acima de 1.000 m² exige robô (Esclarecimento, resposta 07).`]);
    if(l.mem===0 && !l.isEt) alerts.push(["",`Item ${l.item}: nenhuma linha da memória está marcada para este item.`]);
  });
  m.elems.forEach((e,k)=>{ if(formaDe(e)) CAMPOS_CONTA.forEach(([f,n])=>{ const er=erroConta(e[f]); if(er) alerts.push(["bad",`Cálculo ${rot(k)}, ${n}: na conta, ${er}. Confira o que foi digitado.`]); });
  const p=num(e.pct); if(e.tipo && p!=null && p!==100 && !e.desc) alerts.push(["",`Cálculo ${rot(k)} da memória usa ${fmt(p,0)}% sem descrição do motivo.`]);
    const ex=etParse(e.et);
    if(e.tipo && ex){ const ii=m.itens.findIndex(it=>it.item===ex.item);
      if(ii<0) alerts.push(["",`Cálculo ${rot(k)} da memória cobra etapa do item ${ex.item}, que não está na MC.`]);
      else if(!e.fl[ii]) alerts.push(["",`Cálculo ${rot(k)} da memória cobra etapa do item ${ex.item}, mas não está marcada para ele.`]);
      if(m.etapa.item===ex.item) alerts.push(["bad",`Item ${ex.item}: a etapa está indicada na memória (cálculo ${rot(k)}) e também na seção 4. Use só uma das duas.`]); }
    if(e.tipo && !e.et) m.itens.forEach((it,i)=>{ if(e.fl[i] && etapasDe(it.item) && m.etapa.item!==it.item) alerts.push(["",`Cálculo ${rot(k)}: o item ${it.item} é cobrado por etapas. Escolha na coluna "Etapa cobrada" qual etapa está sendo medida (ou 100% se o serviço está completo).`]); });
    if(e.tipo && el[k]!=null && !e.fl.some(Boolean)) alerts.push(["",`Cálculo ${rot(k)} da memória não está marcada para nenhum item.`]); });
  if(!m.mc) alerts.push(["","Informe o número da MC."]);
  return {el,et,linhas,total,alerts};
}

function memVazia(m){ return m.elems.every(e=>!e.desc && !e.a && !e.b && !e.c && !e.qtd); }
function aplicaModelo(m){ const tp=tipoMC(m); if(!memVazia(m)) return;
  const comp=(f,it)=>{ const P=PPU[it]; if(!P) return false; const k=FORMAS[f][3], g=FORMAS[f][4]; if(g) return g==="m3"?P.u==="m³":g==="kg"?/^kg$/i.test(P.u):g==="dia"?P.u==="Diária":false; return k==="diaria"||k==="dias" ? P.u==="Diária" : k==="un" ? !["m²","m","Diária"].includes(P.u) : ["m²","m"].includes(P.u); };
  m.elems=(tp.modelo.length?tp.modelo:[["",tp.f[0]]]).map(([d,f])=>Object.assign(novoElem(f),{desc:d,fl:m.itens.map(it=>comp(f,it.item))})); }

const ehImagem = f => (f.type||"").startsWith("image/") || /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(f.name||"");
async function abreImagem(file){
  try{ if(window.createImageBitmap){ const b=await createImageBitmap(file); return {src:b,w:b.width,h:b.height,fim:()=>b.close&&b.close()}; } }catch(e){}
  const url=URL.createObjectURL(file);
  try{ const img=new Image(); img.src=url; await img.decode(); return {src:img,w:img.naturalWidth,h:img.naturalHeight,fim:()=>URL.revokeObjectURL(url)}; }
  catch(e){ URL.revokeObjectURL(url); const er=new Error(/\.hei[cf]$/i.test(file.name||"")||/hei[cf]/i.test(file.type||"") ? "formato HEIC (iPhone) não é aberto pelo navegador. Mude a câmera para JPG (Ajustes > Câmera > Formatos > Mais compatível) ou envie um print/cópia em JPG." : "o navegador não conseguiu abrir esta imagem."); er.code="formato"; throw er; }
}
async function reduzir(file, maxLado=1600, q=0.82, im=null){
  const own=!im; im = im || await abreImagem(file);
  try{ const s=Math.min(1,maxLado/Math.max(im.w,im.h)); const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(im.w*s)); c.height=Math.max(1,Math.round(im.h*s)); c.getContext("2d").drawImage(im.src,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q)); if(!blob) throw new Error("não foi possível converter a imagem.");
    return {blob,w:c.width,h:c.height,canvas:c}; }
  finally{ if(own) im.fim(); }
}
async function salvaFotoDb(file, im){
  if(!db) throw new Error("sem conexão com o armazenamento.");
  let r=null, data="";
  for(const [lado,q] of [[1280,0.72],[1024,0.62],[800,0.55],[640,0.5]]){ r=await reduzir(file,lado,q,im); data=r.canvas.toDataURL("image/jpeg",q); if(data.length<=230000) break; }
  if(data.length>240000) throw new Error("foto grande demais para salvar.");
  const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  await db.doc("fotos/"+id).set({data,w:r.w,h:r.h,criado:new Date().toISOString()});
  FOTOS[id]=data; return {id,db:true,legenda:"",w:r.w,h:r.h,kb:Math.ceil(data.length/1024)};
}
async function enviarFotos(files){
  const msg=$("#fotoMsg"); msg.classList.remove("err");

  if(!lista.length){ msg.textContent=files.length?"Nenhum arquivo de imagem foi reconhecido.":""; if(files.length) msg.classList.add("err"); return; }
  for(const f of lista){ msg.textContent=`Enviando ${++n} de ${lista.length}…`;
    let im=null;
    try{ im=await abreImagem(f); }catch(e){ erros.push(`${f.name}: ${e.message}`); continue; }

    finally{ im&&im.fim(); }
  }
  msg.textContent=(ok?`${ok} foto(s) anexada(s).`:"Nenhuma foto foi anexada.")+(erros.length?"\nProblemas:\n"+erros.join("\n"):"");
  if(erros.length) msg.classList.add("err");
}

async function baixarPDF(lista, nome){
  if(!window.jspdf||!window.jspdf.jsPDF){ toast("A biblioteca de PDF não carregou. Recarregue a página."); return; }
  toast("Montando o PDF…");
  const VERT=ORI==="portrait"; const doc=new window.jspdf.jsPDF({orientation:VERT?"portrait":"landscape",unit:"mm",format:"a4"});

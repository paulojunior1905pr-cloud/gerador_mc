<style>.bkbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 12px;background:#1f2a37;color:#fff;font:13px system-ui;z-index:50}.bkbar button,.bkbar .bkbtn{position:relative;background:#fff;color:#1f2a37;border:0;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}body{padding-bottom:44px}</style><script>/* Modo independente (GitHub Pages / arquivo local): salva no próprio navegador (IndexedDB). */
(function(){
  if(window.claude) return;
  const DBN="gerador-mc", ST="docs"; let _db=null;
  const abre=()=>_db||(_db=new Promise((ok,er)=>{ const r=indexedDB.open(DBN,1); r.onupgradeneeded=()=>r.result.createObjectStore(ST); r.onsuccess=()=>ok(r.result); r.onerror=()=>er(r.error); }));
  const tx=async(modo,fn)=>{ const d=await abre(); return new Promise((ok,er)=>{ const t=d.transaction(ST,modo); const s=t.objectStore(ST); const r=fn(s); t.oncomplete=()=>ok(r&&r.result); t.onerror=()=>er(t.error); }); };
  const get=k=>tx("readonly",s=>s.get(k)), put=(k,v)=>tx("readwrite",s=>s.put(v,k)), del=k=>tx("readwrite",s=>s.delete(k));
  const todos=async pre=>{ const d=await abre(); return new Promise((ok,er)=>{ const out=[]; const t=d.transaction(ST,"readonly"); const c=t.objectStore(ST).openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ if(String(cur.key).startsWith(pre)) out.push([cur.key,cur.value]); cur.continue(); } }; t.oncomplete=()=>ok(out); t.onerror=()=>er(t.error); }); };
  const ouvintes={};
  const avisa=async col=>{ const l=ouvintes[col]; if(!l||!l.length) return; const snap=await snapCol(col); l.forEach(f=>f(snap)); };
  const snapCol=async col=>{ const r=await todos(col+"/"); const docs=r.map(([k,v])=>({id:k.slice(col.length+1),exists:true,data:()=>JSON.parse(JSON.stringify(v))})); return {size:docs.length,docs}; };
  const doc=path=>{ const col=path.split("/")[0]; return { id:path.split("/").pop(), path,
    get:async()=>{ const v=await get(path); return {id:path.split("/").pop(),exists:v!==undefined,data:()=>v}; },
    set:async v=>{ await put(path,JSON.parse(JSON.stringify(v))); avisa(col); },
    update:async v=>{ const a=(await get(path))||{}; await put(path,Object.assign(a,JSON.parse(JSON.stringify(v)))); avisa(col); },
    delete:async()=>{ await del(path); avisa(col); } }; };
  const db={ doc, collection:col=>({ doc:id=>doc(col+"/"+id),
    onSnapshot:(next,err)=>{ (ouvintes[col]=ouvintes[col]||[]).push(next); snapCol(col).then(next,e=>err&&err({code:String(e)})); return ()=>{ ouvintes[col]=ouvintes[col].filter(f=>f!==next); }; } }) };
  const baixa=(blob,nome)=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000); };
  const downloads={ save:async({filename,data})=>{ baixa(data instanceof Blob?data:new Blob([data]),filename); return {status:"saved"}; } };
  window.claude={ use:async n=> n==="db"?db : n==="downloads"?downloads : null };
  // backup
  window.__backupMC=async()=>{ const r=await todos(""); const o={}; r.forEach(([k,v])=>o[k]=v); baixa(new Blob([JSON.stringify({app:"gerador-mc",versao:1,data:new Date().toISOString(),docs:o})],{type:"application/json"}),"backup_MCs_"+new Date().toISOString().slice(0,10)+".json"); };
  window.__restauraMC=async file=>{ const j=JSON.parse(await file.text()); if(!j.docs) throw new Error("arquivo inválido"); for(const [k,v] of Object.entries(j.docs)) await put(k,v); await avisa("mcs"); return Object.keys(j.docs).filter(k=>k.startsWith("mcs/")).length; };
  document.addEventListener("DOMContentLoaded",()=>{
    const bar=document.createElement("div"); bar.className="bkbar";
    bar.innerHTML='<span>Dados salvos neste aparelho.</span><button type="button" id="bkOut">Baixar backup</button><label class="bkbtn">Restaurar backup<input type="file" accept=".json,application/json" id="bkIn" style="position:absolute;width:1px;height:1px;opacity:0"></label>';
    document.body.appendChild(bar);
    bar.querySelector("#bkOut").onclick=()=>window.__backupMC();
    bar.querySelector("#bkIn").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const n=await window.__restauraMC(f); alert(n+" MC(s) restauradas."); }catch(x){ alert("Não foi possível restaurar: "+x.message); } e.target.value=""; };
  });
})();
</script>

    const acum=r3(ant+bm);
    return {i,item:it.item,P,faixa,fat,precoAp,dem,mem,prev,ant,bm,acum,pa:prev?acum/prev:null,valor:r2(bm*precoAp),isEt,metodo:it.metodo};
  });
  const total=r2(linhas.reduce((s,l)=>s+(l?l.valor:0),0));
  const alerts=[];
  linhas.forEach(l=>{ if(!l) return;
    if(l.acum>l.prev+0.0005) alerts.push(["bad",`Item ${l.item}: o acumulado (${fmt(l.acum,3)}) passa da quantidade prevista (${fmt(l.prev,3)}).`]);
    if(l.faixa && !l.metodo) alerts.push(["",`Item ${l.item}: informe o método. Se for convencional (operador no bico/pistola), o preço cai 30%.`]);
    if(l.faixa && l.prev>1000 && l.metodo==="conv") alerts.push(["",`Item ${l.item}: área acima de 1.000 m² exige robô (Esclarecimento, resposta 07).`]);
    if(l.mem===0 && !l.isEt) alerts.push(["",`Item ${l.item}: nenhuma linha da memória está marcada para este item.`]);
  });
  m.elems.forEach((e,k)=>{ const p=num(e.pct); if(e.tipo && p!=null && p!==100 && !e.desc) alerts.push(["",`Linha ${k+1} da memória usa ${fmt(p,0)}% sem descrição do motivo.`]);
    if(e.tipo && el[k]!=null && !e.fl.some(Boolean)) alerts.push(["",`Linha ${k+1} da memória não está marcada para nenhum item.`]); });
  if(!m.mc) alerts.push(["","Informe o número da MC."]);
  return {el,et,linhas,total,alerts};
}

  db = await claude.use("db");

  try{ downloads = await claude.use("downloads"); }catch(e){ downloads=null; }
  if(!db){ clearTimeout(to); status("Modo sem salvamento"); return; }
  db.collection("mcs").onSnapshot(snap=>{
    clearTimeout(to); MCS={}; snap.docs.forEach(d=>{ MCS[d.id]=normaliza(d.data()); });
    status(snap.size+" MC(s) salvas");
    if(curId && MCS[curId] && !saveT && !document.activeElement?.closest("#ed")) { cur=MCS[curId]; renderEditor(); }

const ehImagem = f => (f.type||"").startsWith("image/") || /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(f.name||"");
async function abreImagem(file){
  try{ if(window.createImageBitmap){ const b=await createImageBitmap(file); return {src:b,w:b.width,h:b.height,fim:()=>b.close&&b.close()}; } }catch(e){}
  const url=URL.createObjectURL(file);
  try{ const img=new Image(); img.src=url; await img.decode(); return {src:img,w:img.naturalWidth,h:img.naturalHeight,fim:()=>URL.revokeObjectURL(url)}; }
  catch(e){ URL.revokeObjectURL(url); const er=new Error(/\.hei[cf]$/i.test(file.name||"")||/hei[cf]/i.test(file.type||"") ? "formato HEIC (iPhone) não é aberto pelo navegador. Mude a câmera para JPG (Ajustes > Câmera > Formatos > Mais compatível) ou envie um print/cópia em JPG." : "o navegador não conseguiu abrir esta imagem."); er.code="formato"; throw er; }
}
async function reduzir(file, maxLado=1600, q=0.82, im=null){
  const own=!im; im = im || await abreImagem(file);
  try{ const s=Math.min(1,maxLado/Math.max(im.w,im.h)); const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(im.w*s)); c.height=Math.max(1,Math.round(im.h*s)); c.getContext("2d").drawImage(im.src,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q)); if(!blob) throw new Error("não foi possível converter a imagem.");
    return {blob,w:c.width,h:c.height,canvas:c}; }
  finally{ if(own) im.fim(); }
}
async function salvaFotoDb(file, im){
  if(!db) throw new Error("sem conexão com o armazenamento.");
  let r=null, data="";
  for(const [lado,q] of [[1280,0.72],[1024,0.62],[800,0.55],[640,0.5]]){ r=await reduzir(file,lado,q,im); data=r.canvas.toDataURL("image/jpeg",q); if(data.length<=230000) break; }
  if(data.length>240000) throw new Error("foto grande demais para salvar.");
  const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  await db.doc("fotos/"+id).set({data,w:r.w,h:r.h,criado:new Date().toISOString()});
  FOTOS[id]=data; return {id,db:true,legenda:"",w:r.w,h:r.h};
}
async function enviarFotos(files){
  const msg=$("#fotoMsg"); msg.classList.remove("err");
  if(!cur){ msg.textContent="Abra ou crie uma MC antes de anexar fotos."; msg.classList.add("err"); return; }
  const lista=files.filter(ehImagem); const erros=[]; let n=0, ok=0;
  if(!lista.length){ msg.textContent=files.length?"Nenhum arquivo de imagem foi reconhecido.":""; if(files.length) msg.classList.add("err"); return; }
  for(const f of lista){ msg.textContent=`Enviando ${++n} de ${lista.length}…`;
    let im=null;
    try{ im=await abreImagem(f); }catch(e){ erros.push(`${f.name}: ${e.message}`); continue; }
    try{
      let foto=null, errA=null;
      if(assets){ try{ const {blob,w,h}=await reduzir(f,1600,0.82,im); const up=await assets.upload(blob,{type:"image/jpeg"}); BLOBS[up.id]=blob; foto={id:up.id,url:up.url,legenda:"",w,h}; }catch(e){ errA=e; } }
      if(!foto){ try{ foto=await salvaFotoDb(f,im); }catch(e){ throw (errA||e); } }
      cur.fotos.push(foto); ok++; renderFotos(); salvar();
    }catch(e){ erros.push(`${f.name}: ${e.code==="quota_or_state"?"espaço de fotos cheio":(e.message||e.code||"erro desconhecido")}`); }
    finally{ im&&im.fim(); }
  }
  msg.textContent=(ok?`${ok} foto(s) anexada(s).`:"Nenhuma foto foi anexada.")+(erros.length?"\nProblemas:\n"+erros.join("\n"):"");
  if(erros.length) msg.classList.add("err");
}
